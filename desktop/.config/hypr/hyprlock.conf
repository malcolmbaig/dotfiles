$font = JetBrains Mono

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    color = rgba(d7c9b8ff)
    font_size = 88
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(918a82ff)
    font_size = 18
    font_family = $font
    position = 0, 25
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 2
    inner_color = rgba(161616cc)
    outer_color = rgba(33ccffff)
    check_color = rgba(8aadf4ff)
    fail_color = rgba(ed8796ff)
    font_color = rgba(d7c9b8ff)
    font_family = $font
    placeholder_text = Password
    fail_text = $FAIL
    dots_center = true
    fade_on_empty = false
    rounding = 8
    position = 0, -55
    halign = center
    valign = center
}
