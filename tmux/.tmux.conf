#******************************************************************************
# Basic Setup
#******************************************************************************

# Change the default $TERM to xterm-256color
set -g default-terminal "tmux-256color"

# Enable RGB colour if running in xterm(1)
set-option -sa terminal-overrides ",xterm*:Tc"

set -g focus-events on
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# GNU-Screen compatible prefix
set -g prefix2 C-f
bind C-f send-prefix -2
unbind C-b

# No bells at all
set -g bell-action none

# Increase history
set -g history-limit 10000

# Key mapping to reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

#******************************************************************************
# Display Settings
#******************************************************************************

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# Pane config
set -g status-position bottom

# Command/message line colors
set -g message-style fg=white,bg=colour0

#******************************************************************************
# Pane Navigation
#******************************************************************************

# Rename window (clears existing name)
bind , send-keys C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h C-h \; command-prompt -p "rename window: " "rename-window '%%'"

# Create a new window
bind N new-window

# Next/previous window
bind n next-window
bind p previous-window

# No confirm on kill-pane
bind x kill-pane

# Move window order with Ctrl-Shift-Left/Right
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# Split current window horizontally
bind - split-window -v -c "#{pane_current_path}"
# Split current window vertically
bind | split-window -h -c "#{pane_current_path}"

# Use vi movement when switching panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Switch on mouse navigation
setw -g mouse on

# Resize current pane to 75% of window width
bind M resize-pane -x "65%"

#******************************************************************************
# Clipboard Configuration
#******************************************************************************

# Select / Copy config
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy --type text/plain"

#******************************************************************************
# Status Bar
#******************************************************************************

# Ayu/Ghostty palette
set -g @ayu_bg "#0A0E14"
set -g @ayu_bar "#11151C"
set -g @ayu_text "#B3B1AD"
set -g @ayu_dim "#565B66"
set -g @ayu_white "#E6E1CF"
set -g @ayu_cyan "#59C2FF"
set -g @ayu_orange "#FFB454"

set -g status-position top
set -g status-interval 1
set -g status-left "#[bg=#{@ayu_bar},fg=#{@ayu_cyan},bold] #{session_name} #[bg=#{@ayu_bar},fg=#{@ayu_dim},nobold]│ "
set -g status-left-length 50
set -g status-right "#[bg=#{@ayu_bar},fg=#{@ayu_dim}]│ #[bg=#{@ayu_bar},fg=#{@ayu_text}]%Y-%m-%d #[bg=#{@ayu_bar},fg=#{@ayu_orange}]%H:%M "
set -g status-right-length 50
set -g status-style "fg=#{@ayu_text},bg=#{@ayu_bar}"
set -g status-justify "absolute-centre"
set -g window-status-format         "#[bg=#{@ayu_bar},fg=#{@ayu_dim}] #I #[bg=#{@ayu_bar},fg=#{@ayu_text}]#W#[fg=#{@ayu_cyan}]#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-format "#[bg=#{@ayu_bar},fg=#{@ayu_orange},bold] #I #[bg=#{@ayu_bar},fg=#{@ayu_white},bold]#W#[fg=#{@ayu_cyan}]#{?window_zoomed_flag, 󰊓,} "
set -g pane-active-border-style "bg=default,fg=#{@ayu_cyan},bold"
set -g pane-border-style "bg=default,fg=#{@ayu_dim}"

#******************************************************************************
# Plugins
#******************************************************************************

set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
